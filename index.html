<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Speed Test</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&family=Arial:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Theme Toggle Button (Top Right) -->
    <button id="theme-toggle" class="theme-btn-top" aria-label="Toggle theme">
        <!-- Sun Icon (shown in dark theme) -->
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <!-- Moon Icon (shown in light theme) -->
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
        <span id="theme-text">Theme</span>
    </button>

    <main class="app-container">
        
        <h1 class="main-title">Your Internet speed is</h1>

        <div class="speed-showcase">
            <div class="speed-readout">
                <span id="speed-value" class="mega-text">0</span>
                <span id="speed-unit" class="speed-unit">Mbps</span>
            </div>
            
            <button id="start-btn" class="refresh-btn" aria-label="Restart Test">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>
        </div>

        <div id="advanced-metrics" class="advanced-metrics">
            <div class="metrics-grid">
                
                <!-- Latency Section -->
                <div class="metric-section">
                    <h2 class="metric-header">Latency</h2>
                    <div class="metric-subgrid">
                        <div class="metric-card">
                            <div class="metric-label">Unloaded</div>
                            <div class="metric-value-wrap">
                                <span id="ping-unloaded" class="metric-value">--</span>
                                <span class="metric-unit">ms</span>
                            </div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">Loaded</div>
                            <div class="metric-value-wrap">
                                <span id="ping-loaded" class="metric-value">--</span>
                                <span class="metric-unit">ms</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Upload Section -->
                <div class="metric-section">
                    <h2 class="metric-header">Upload</h2>
                    <div class="metric-card mt-auto">
                        <div class="metric-label">Speed</div>
                        <div class="metric-value-wrap">
                            <span id="upload-value" class="metric-value">--</span>
                            <span id="upload-unit" class="metric-unit">Mbps</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="client-server-info">
                <div class="info-group">
                    <span class="info-label">Client</span> 
                    <span id="client-info">Fetching location...</span> | 
                    <span id="client-ip">Fetching IP...</span>
                </div>
                <div class="info-group">
                    <span class="info-label">Server(s)</span> 
                    <span id="server-info">Cloudflare Global Network</span>
                </div>
            </div>
        </div>

        <!-- Bottom Status Bar -->
        <div class="status-bar">
            <div class="bar-left-controls">
                <button id="settings-btn" class="bar-btn" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    Settings
                </button>
            </div>

            <div class="data-usage">
                <span class="data-item" title="Data Downloaded">
                    <span id="data-down">0.0MB</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                </span>
                <span class="data-item" title="Data Uploaded">
                    <span id="data-up">0.0MB</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                </span>
            </div>
        </div>

        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel hidden">
            <div class="settings-grid">
                <div class="settings-group">
                    <h3 class="settings-title">Parallel connections</h3>
                    <div class="settings-inputs">
                        <label>Min: <input type="number" id="setting-conn-min" value="1"></label>
                        <label>Max: <input type="number" id="setting-conn-max" value="8"></label>
                    </div>
                </div>
                <div class="settings-group">
                    <h3 class="settings-title">Test duration (seconds)</h3>
                    <div class="settings-inputs">
                        <label>Min: <input type="number" id="setting-dur-min" value="5"></label>
                        <label>Max: <input type="number" id="setting-dur-max" value="30"></label>
                    </div>
                </div>
            </div>

            <div class="settings-checkboxes">
                <label class="checkbox-label">
                    <input type="checkbox" id="setting-latency">
                    <span>Measure loaded latency during upload</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="setting-always-show">
                    <span>Always show all metrics</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="setting-save-config">
                    <span>Save config for this device</span>
                </label>
            </div>

            <div class="settings-actions">
                <button id="settings-reset" class="btn btn-secondary">Reset</button>
                <button id="settings-cancel" class="btn btn-secondary">Cancel</button>
                <button id="settings-save" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
